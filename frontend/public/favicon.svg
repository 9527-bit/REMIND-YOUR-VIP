<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071412"/>
      <stop offset="100%" stop-color="#0f2621"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loopGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="loopGradB" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="18" fill="url(#glowGrad)"/>

  <!-- Base Infinity Loop -->
  <path d="M 32 32 C 38 21 49 21 53 26 C 57 31 57 33 53 38 C 49 43 38 43 32 32 C 26 21 15 21 11 26 C 7 31 7 33 11 38 C 15 43 26 43 32 32 Z"
        fill="none"
        stroke="url(#loopGradA)"
        stroke-width="5.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- 3D Overpass Cut & Strand -->
  <path d="M 26 22 C 28.5 26.5 30.5 29.5 32 32 C 33.5 34.5 35.5 37.5 38 42"
        fill="none"
        stroke="#071412"
        stroke-width="8.5"
        stroke-linecap="round"/>
  <path d="M 26 22 C 28.5 26.5 30.5 29.5 32 32 C 33.5 34.5 35.5 37.5 38 42"
        fill="none"
        stroke="url(#loopGradB)"
        stroke-width="5.5"
        stroke-linecap="round"/>

  <!-- Sparkle Accent at Top-Right Apex -->
  <path d="M 48 14 Q 48 18 52 18 Q 48 18 48 22 Q 48 18 44 18 Q 48 18 48 14 Z"
        fill="#a7f3d0"
        filter="url(#glow)"/>
  <circle cx="48" cy="18" r="1.2" fill="#ffffff"/>
</svg>